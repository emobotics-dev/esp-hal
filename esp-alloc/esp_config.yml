crate: esp-alloc

options:
  - name: heap_algorithm
    description: "The heap algorithm to use. TLSF offers higher performance
      and bounded allocation time, but uses more memory."
    default:
      - value: '"LLFF"'
    constraints:
      - type:
          validator: enumeration
          value:
            - "LLFF"
            - "TLSF"

  - name: global_preference
    description: "Where the global allocator (Rust's `Box`, `Vec`, `String`) looks
      first. `Any`: every region, first fit in registration order. `External`:
      external (PSRAM) regions first, then any region, so internal RAM is left to
      what asks for it (`InternalMemory`, `malloc_internal`, DMA). C `malloc` is
      unaffected either way."
    default:
      - value: '"Any"'
    constraints:
      - type:
          validator: enumeration
          value:
            - "Any"
            - "External"
